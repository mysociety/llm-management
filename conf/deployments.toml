# Shared checkpoint identities; local resources pin these revisions.
# Exoscale managed imports by repository name and cannot attest the served SHA.
[model.question_slice]
repo = "mySociety/question-slice-modernbert-2026-09-08-1"
revision = "eb0436d4be96f113f35b5f891f9cc876a0f0bd6b"

[model.foi_topic]
repo = "mySociety/foi-topic-1b-2026-09-16-1"
revision = "c2ba6b86e43977bcb71bc90f12dc0cad42ac7e79"

[model.foi_status]
repo = "mySociety/foi-status-3b-2026-10-12-1"
revision = "fde4ea32e68755ef6c08d2bd73cb804c3890b2df"

[model.sar_logistic]
repo = "mySociety/sar-detect-logistic-2026-10-09-1"
revision = "ade6333a06995cbde835648d758d8b092900bc52"

[model.sar_deberta]
repo = "mySociety/sar-detect-deberta-2026-10-09-1"
revision = "199883a0387af896f34f7bf0978472268a9474b9"

[[local.deployment]]
slug = "question_slice_cpu"
loader = "modernbert_classifier"
model_ref = "question_slice"
max_tokens = 768

[[local.deployment]]
slug = "question_slice_head_cpu"
loader = "modernbert_head"
model_ref = "question_slice"

[[local.deployment]]
slug = "question_extractor_tokenizer"
loader = "topic_tokenizer"
model_ref = "foi_topic"
max_tokens = 2048


[[local.deployment]]
slug = "presidio"
loader = "presidio"
spacy_model = "en_core_web_sm"
score_threshold = 0.5

[[local.deployment]]
slug = "sar_logistic_cpu"
loader = "sar_logistic"
model_ref = "sar_logistic"
artifact = "model.json"

[[local.deployment]]
slug = "sar_deberta_cpu"
loader = "sar_deberta"
model_ref = "sar_deberta"
max_tokens = 512

[foi]
classifier = "question_slice_cpu"
head = "question_slice_head_cpu"
tokenizer = "question_extractor_tokenizer"
extraction_deployment = "question_slice"
topic_deployment = "foi_topic"
response_deployment = "foi_status"
response_tokenizer = "foi_status_tokenizer"

[foi.topic]
output_limit = 2048
min_output_tokens = 256
output_overhead = 64
output_tokens_per_question = 192

[foi.response]
context_tokens = 8192
output_tokens = 2048

[sanitization]
deployment = "presidio"

[sar]
logistic = "sar_logistic_cpu"
classifier = "sar_deberta_cpu"

[[exoscale.deployment]]

slug = "olmo3_7b"
# 0.31.0's Anthropic template probe crashes on OLMo's undefined tools variable.
inference_engine_version = "0.29.0"
model = "allenai/Olmo-3-7B-Instruct"
gpu_type = "gpua5000"
gpu_count = 1
replicas = 1
zone = "at-vie-2"
inference_engine_params = [
    # 20,000 tokens exceeds available KV cache on a single A5000.
    "--max-model-len=16384",
    "--enable-prefix-caching",
    "--enable-auto-tool-choice",
    "--tool-call-parser=olmo3",
    "--structured-outputs-config={\"backend\":\"xgrammar\",\"disable_any_whitespace\":true}",
]

[[exoscale.deployment]]
# doesn't actually support tool calls
slug = "toast_llama"
model = "mySociety/Toast_Llama_safetensors"
gpu_type = "gpua5000"
gpu_count = 1
replicas = 1
zone = "at-vie-2"
inference_engine_params = [
    "--max-model-len=110000",
    "--enable-prefix-caching",
    "--enable-auto-tool-choice",
    "--tool-call-parser=pythonic",
]



[[exoscale.deployment]]
# Fine-tuned encoder on GPU; its original classification head runs in the API.
# Native /classify is not exposed by the managed gateway, so use /v1/embeddings.
slug = "question_slice"
model_ref = "question_slice"
gpu_type = "gpua5000"
gpu_count = 1
replicas = 1
zone = "at-vie-2"
inference_engine_params = [
    "--runner=pooling",
    "--max-model-len=768",
    "--dtype=float16",
    "--enforce-eager",
    "--no-enable-prefix-caching",
    '--hf-overrides={"architectures":["ModernBertModel"]}',
    "--convert=embed",
    '--pooler-config={"seq_pooling_type":"MEAN","use_activation":false}',
]


[[exoscale.deployment]]
# Full checkpoint: Granite 4.0 1B with the grounded-v2 adapter merged in.
# Merged artifact validated at c2ba6b86e43977bcb71bc90f12dc0cad42ac7e79.
slug = "foi_topic"
model_ref = "foi_topic"
gpu_type = "gpua5000"
gpu_count = 1
replicas = 1
zone = "at-vie-2"
inference_engine_params = [
    "--max-model-len=4096",
    "--dtype=bfloat16",
    "--enforce-eager",
    "--no-enable-prefix-caching",
    '--structured-outputs-config={"backend":"xgrammar","disable_any_whitespace":true}',
]


[[exoscale.deployment]]
# Merged Granite 4.2 3B status candidate; prompt/tokenizer artifacts are pinned locally.
slug = "foi_status"
model_ref = "foi_status"
gpu_type = "gpua5000"
gpu_count = 1
replicas = 1
zone = "at-vie-2"
inference_engine_params = [
    "--max-model-len=8192",
    "--dtype=bfloat16",
    "--enforce-eager",
    "--no-enable-prefix-caching",
    '--structured-outputs-config={"backend":"xgrammar","disable_any_whitespace":true}',
]


[[exoscale.deployment]]
# Prepared GPU Compute server; model and VM settings come from the recipe.
slug = "clef"
backend = "exoscale_compute"
protocol = "systemone"
template = "clef_flash"


# Group slugs use the reserved group_ prefix for shared lifecycle API routing.
[[deployment_group]]
slug = "group_foi_pipeline"
# Remote deployments and registered local CPU resources share the warm-up path.
deployments = [
    "presidio",
    "question_slice_head_cpu",
    "question_extractor_tokenizer",
    "question_slice",
    "foi_topic",
]


[[deployment_group]]
slug = "group_foi_pipeline_cpu"
deployments = ["presidio", "question_slice_cpu", "question_extractor_tokenizer", "foi_topic"]


[[deployment_group]]
slug = "group_sar_pipeline_cpu"
deployments = ["sar_logistic_cpu", "sar_deberta_cpu"]

# Automatic email detection, pinned from fast-auto-classifier releases.json.
[model.auto_logistic]
repo = "mySociety/autoreply-logistic-2026-10-09-1"
revision = "9cff7b1018a61bd919fb049e3aca005952a101c7"

[model.auto_deberta]
repo = "mySociety/autoreply-deberta-2026-10-09-1"
revision = "ddf70e25af71b64260e72ac3cdef1353a990d4c8"

[[local.deployment]]
slug = "auto_logistic_cpu"
loader = "auto_logistic"
model_ref = "auto_logistic"

[[local.deployment]]
slug = "auto_deberta_cpu"
loader = "auto_deberta"
model_ref = "auto_deberta"
max_tokens = 512

[automatic]
logistic = "auto_logistic_cpu"
classifier = "auto_deberta_cpu"

[[deployment_group]]
slug = "group_automatic_pipeline_cpu"
deployments = ["auto_logistic_cpu", "auto_deberta_cpu"]


[[deployment_group]]
slug = "group_foi_response_pipeline"
deployments = ["presidio", "foi_status_tokenizer", "foi_status"]

[[local.deployment]]
slug = "foi_status_tokenizer"
loader = "response_tokenizer"
model_ref = "foi_status"


# External API services have server-owned credential references, no VM lifecycle.
[api.service.openai]
provider = "openai"
protocol = "responses"
credential = "openai"

[api.service.tavily]
provider = "tavily"
credential = "tavily"

[[api.deployment]]
slug = "gpt_6_1_low"
service = "openai"
model = "gpt-6.1-sol"
# GPT-6.1 does not support "none"; "low" is its lowest reasoning effort.
reasoning_effort = "low"
max_tokens = 4096

[[api.search]]
slug = "tavily_search"
service = "tavily"
