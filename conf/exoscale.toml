[[deployment]]

slug = "olmo3_7b"
model = "allenai/Olmo-3-7B-Instruct"
gpu_type = "gpua5000"
gpu_count = 1
replicas = 1
zone = "at-vie-2"
inference_engine_params = [
    # 20,000 tokens exceeds available KV cache on a single A5000.
    "--max-model-len=16384",
    "--enable-prefix-caching",
    "--enable-auto-tool-choice",
    "--tool-call-parser=olmo3",
    "--structured-outputs-config={\"backend\":\"xgrammar\",\"disable_any_whitespace\":true}",
]

[[deployment]]

slug = "dunno_llama_3b"
model = "mySociety/Dunno_Llama_3B_safetensors"
gpu_type = "gpua5000"
